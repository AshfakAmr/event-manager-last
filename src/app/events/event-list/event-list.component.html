<div class="event-list-container">
  <div class="top-bar">
    <h2 class="welcome-text">Welcome, {{ userName }}</h2>
    <button mat-stroked-button color="warn" (click)="logout()">Logout</button>
  </div>

  <div class="header-actions">
    <button mat-raised-button color="primary" [routerLink]="['/events/new']">
      + Create Event
    </button>
  </div>

  <!-- Filters -->
  <div class="filters-container">
    <input
      type="text"
      placeholder="Search by title or description"
      [(ngModel)]="searchQuery"
      (input)="filterEvents()"
      class="search-input"
    />

    <select
      [(ngModel)]="selectedFilter"
      (change)="filterEvents()"
      class="filter-dropdown"
    >
      <option value="all">All Events</option>
      <option value="past">Past Events</option>
      <option value="upcoming">Upcoming Events</option>
    </select>

    <select
      [(ngModel)]="selectedSort"
      (change)="filterEvents()"
      class="sort-dropdown"
    >
      <option value="none">none</option>
      <option value="dateAsc">Sort by Date (Ascending)</option>
      <option value="dateDesc">Sort by Date (Descending)</option>
      <option value="titleAsc">Sort by Title (Ascending)</option>
      <option value="titleDesc">Sort by Title (Descending)</option>
    </select>
  </div>

  <!-- Events Grid -->
  <div class="events-grid">
    <div *ngIf="filteredEvents.length === 0" class="no-events-msg">
      <p>No events created.</p>
    </div>

    <div *ngFor="let event of filteredEvents" class="event-card">
      <mat-card>
        <mat-card-header>
          <mat-card-title>
            <strong>Event:</strong> {{ event.title }}
          </mat-card-title>
        </mat-card-header>

        <mat-card-content>
          <p><strong>Description:</strong> {{ event.description }}</p>
          <p><strong>Date:</strong> {{ event.date }}</p>
        </mat-card-content>

        <mat-card-actions class="mat-card-actions">
          <button
            mat-stroked-button
            color="accent"
            [routerLink]="['/events', event.id]"
          >
            View
          </button>
          <button
            mat-stroked-button
            color="primary"
            [routerLink]="['/events', event.id, 'edit']"
          >
            Edit
          </button>
          <button
            mat-stroked-button
            color="warn"
            (click)="deleteEvent(event.id)"
          >
            Delete
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
